name: Silent-PC-Monitor

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur suchen, keine Push-Nachrichten senden'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: silent-pc-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Anzeigen prüfen
        run: npm run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.SILENTMAXX }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      - name: Statusdaten speichern
        run: |
          if ! git diff --quiet -- data || test -n "$(git ls-files --others --exclude-standard data)"; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- data/seen.json data/latest.json
            git commit -m "chore: update monitor state"
            git push
          fi
